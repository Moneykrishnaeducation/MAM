[project]
name = "MAM"
version = "0.1.0"
description = "A Python project created with Better Fullstack"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Your Name", email = "your.email@example.com" }
]

dependencies = [
    "django>=5.1",
    "django-cors-headers>=4.9.0",
    "psycopg2-binary>=2.9.9",
    "asyncpg>=0.29.0",
    "tortoise-orm>=0.25.0",
    "aerich>=0.8.0",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.13.1",
    "email-validator>=2.3.0",
    "fastapi-users[sqlalchemy]>=15.0.5",
    "django-ninja>=1.6.2",
    "aiocache>=0.12.3",
    "python-socketio>=5.13.0",
    "rich>=14.0.0",
    "requests>=2.32.3",
    "pillow>=11.0.0",
    "gunicorn>=23.0.0",
    "confluent-kafka>=2.6.0",
    "strawberry-graphql[django]>=0.262.0",
    "sentry-sdk>=2.59.0",
    "upstash-redis>=1.7.0",
    "meilisearch>=0.41.0",
    "python-dotenv>=1.2.2",
    "waitress>=3.0.2",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.15.9",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "hypothesis>=6.130.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backendPanel", "adminPanel", "clientPanel"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
]
ignore = [
    "E501",   # line too long (handled by formatter)
]

[tool.ruff.lint.per-file-ignores]
"migrations/env.py" = ["E402"]
"backendPanel/main.py" = ["I001", "E402"]
"adminPanel/users.py" = ["B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"



[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.tortoise]
tortoise_orm = "backendPanel.database.TORTOISE_ORM"
location = "./migrations"
src_folder = "./."
